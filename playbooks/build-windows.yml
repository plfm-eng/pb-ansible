---
- name: Compilar y empaquetar en pb-build (Windows, WinRM 5986)
  hosts: build
  gather_facts: false
  vars:
    workspace: 'C:\pb-build\work'
    version: "{{ lookup('env', 'PB_VERSION') }}"
    source_zip: "{{ lookup('env', 'PB_SOURCE_ZIP') }}"
    dist_dir: "{{ lookup('env', 'PB_DIST_DIR') }}"
  tasks:
    - name: Carpeta base en pb-build
      ansible.windows.win_file:
        path: 'C:\pb-build'
        state: directory
    - name: Comprobar si Inno Setup (gratuito) ya esta en pb-build
      ansible.windows.win_stat:
        path: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      register: iscc
    - name: Descargar Inno Setup EN EL RUNNER (pb-build no sale a Internet; solo el runner tiene salida 443)
      ansible.builtin.get_url:
        url: https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
        dest: "{{ dist_dir }}/innosetup.exe"
        mode: "0644"
      delegate_to: localhost
      when: not iscc.stat.exists
    - name: Verificar que lo descargado es un ejecutable de Windows (no una pagina web)
      ansible.builtin.shell: head -c 2 "{{ dist_dir }}/innosetup.exe" | grep -q MZ && stat -c %s "{{ dist_dir }}/innosetup.exe"
      delegate_to: localhost
      changed_when: false
      when: not iscc.stat.exists
    - name: Copiar el instalador de Inno Setup a pb-build por WinRM
      ansible.windows.win_copy:
        src: "{{ dist_dir }}/innosetup.exe"
        dest: 'C:\pb-build\innosetup.exe'
      when: not iscc.stat.exists
    - name: Instalar Inno Setup en silencio
      ansible.windows.win_package:
        path: 'C:\pb-build\innosetup.exe'
        arguments: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS
        creates_path: 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      when: not iscc.stat.exists
    - name: Limpiar el espacio de trabajo
      ansible.windows.win_file:
        path: "{{ workspace }}"
        state: absent
    - name: Crear el espacio de trabajo
      ansible.windows.win_file:
        path: "{{ workspace }}"
        state: directory
    - name: Copiar el codigo fuente (zip del commit)
      ansible.windows.win_copy:
        src: "{{ source_zip }}"
        dest: "{{ workspace }}\\fuente.zip"
    - name: Descomprimir el codigo
      ansible.windows.win_shell: tar -xf "{{ workspace }}\fuente.zip" -C "{{ workspace }}"
    - name: Ejecutar el build (PBAutoBuild si existe + Inno Setup)
      ansible.windows.win_shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{{ workspace }}\build\build-pb.ps1" -Version "{{ version }}" -Workspace "{{ workspace }}"
      register: build
    - name: Salida del build
      ansible.builtin.debug:
        msg: "{{ build.stdout_lines }}"
    - name: Recuperar el instalador al runner
      ansible.builtin.fetch:
        src: "{{ workspace }}\\dist\\pb-app-setup-{{ version }}.exe"
        dest: "{{ dist_dir }}/"
        flat: true
