---
- name: Desplegar pb-app en la VM Windows del ambiente (WinRM 5986)
  hosts: targets
  gather_facts: true
  vars:
    app_root: 'C:\pb-app'
    package_path: "{{ lookup('env', 'PB_PACKAGE') }}"
    version: "{{ lookup('env', 'PB_VERSION') }}"
  tasks:
    - name: Mostrar el sistema operativo de la VM destino
      ansible.builtin.debug:
        msg: "{{ ansible_os_name }} ({{ ansible_architecture }})"

    - name: Crear carpetas de la aplicacion
      ansible.windows.win_file:
        path: "{{ item }}"
        state: directory
      loop:
        - "{{ app_root }}\\instaladores"
        - "{{ app_root }}\\app"

    - name: Copiar el instalador generado por el build
      ansible.windows.win_copy:
        src: "{{ package_path }}"
        dest: "{{ app_root }}\\instaladores\\pb-app-{{ version }}.tar.gz"

    - name: Instalar en silencio (en la version real es el setup.exe de Inno Setup con /VERYSILENT)
      ansible.windows.win_shell: >
        tar -xzf "{{ app_root }}\instaladores\pb-app-{{ version }}.tar.gz"
        -C "{{ app_root }}\app" --strip-components=1

    - name: Verificar la version instalada
      ansible.windows.win_shell: Select-String -Path "{{ app_root }}\app\index.html" -Pattern 'version [0-9.]+' | ForEach-Object { $_.Matches.Value }
      register: instalado
      changed_when: false
      failed_when: "('version ' + version) not in instalado.stdout"

    - name: Resultado
      ansible.builtin.debug:
        msg: "Instalado en {{ app_root }}\\app: {{ instalado.stdout | trim }}"
