---
- name: Instalar pb-app en la VM Windows del ambiente y probar (WinRM 5986)
  hosts: targets
  gather_facts: true
  vars:
    version: "{{ lookup('env', 'PB_VERSION') }}"
    installer: "{{ lookup('env', 'PB_INSTALLER') }}"
    smoke_test: "{{ lookup('env', 'PB_SMOKE_TEST') }}"
  tasks:
    - name: Sistema operativo de la VM destino
      ansible.builtin.debug:
        msg: "{{ ansible_os_name }} ({{ ansible_architecture }})"
    - name: Carpeta de instaladores
      ansible.windows.win_file:
        path: 'C:\pb-app-instaladores'
        state: directory
    - name: Copiar el instalador generado en pb-build
      ansible.windows.win_copy:
        src: "{{ installer }}"
        dest: 'C:\pb-app-instaladores\pb-app-setup-{{ version }}.exe'
    - name: Copiar las pruebas de humo
      ansible.windows.win_copy:
        src: "{{ smoke_test }}"
        dest: 'C:\pb-app-instaladores\smoke.ps1'
    - name: Retirar una instalacion previa de 32 bits si existe (primer intento de la PoC)
      ansible.windows.win_shell: |
        $u = 'C:\Program Files (x86)\pb-app\unins000.exe'
        if (Test-Path $u) { Start-Process -FilePath $u -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait; "desinstalada" } else { "no habia" }
      register: previa
      changed_when: "'desinstalada' in previa.stdout"
    - name: Instalar en silencio (Inno Setup /VERYSILENT)
      ansible.windows.win_package:
        path: 'C:\pb-app-instaladores\pb-app-setup-{{ version }}.exe'
        arguments: /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
        product_id: '{7E3B1C2A-PBAPP-POC-0001}_is1'
        state: present
      register: instalacion
    - name: Ejecutar las pruebas de humo
      ansible.windows.win_shell: powershell -NoProfile -ExecutionPolicy Bypass -File C:\pb-app-instaladores\smoke.ps1 -Version "{{ version }}"
      register: pruebas
      changed_when: false
    - name: Resultado de las pruebas
      ansible.builtin.debug:
        msg: "{{ pruebas.stdout_lines }}"
